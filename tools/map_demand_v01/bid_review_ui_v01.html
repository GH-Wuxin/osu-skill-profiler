<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Map Demand · BID 评审台</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e13;--panel:#121722;--panel2:#171e2b;--line:#283246;--text:#edf2ff;--muted:#94a0b8;--blue:#6fa8ff;--cyan:#5ee0d2;--warn:#ffcc75;--bad:#ff758f;--ok:#76e6a3}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#182b48 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1180px,calc(100% - 32px));margin:36px auto 80px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.top h1{font-size:clamp(26px,4vw,42px);line-height:1.05;margin:6px 0}.sub{color:var(--muted);max-width:720px}.status{white-space:nowrap;color:var(--muted);font-size:13px}
    .search,.map,.toolbar,.axis,.savebox{border:1px solid var(--line);background:rgba(18,23,34,.94);border-radius:16px}.search{display:grid;grid-template-columns:1fr auto;padding:10px;margin-bottom:18px;box-shadow:0 16px 60px #0006}.search>input{min-width:0;border:0;background:transparent;color:var(--text);padding:12px 14px;font-size:20px;outline:0}.search button,.button{border:0;border-radius:11px;background:var(--blue);color:#07101d;font-weight:750;padding:11px 18px;cursor:pointer}.button.secondary{background:#26344b;color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}
    .modbar{grid-column:1/-1;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 10px 3px;border-top:1px solid var(--line)}.modbar .caption{color:var(--muted);font-size:12px;margin-right:2px}.modbar label{cursor:pointer}.modbar input{position:absolute;opacity:0;pointer-events:none}.modbar span{display:block;border:1px solid var(--line);border-radius:9px;padding:5px 10px;color:var(--muted);font-size:12px;font-weight:750;transition:.15s}.modbar input:checked+span{border-color:var(--cyan);background:#173a3c;color:var(--cyan)}.modsep{width:1px;height:20px;background:var(--line);margin:0 3px}
    .message{min-height:24px;margin:10px 3px;color:var(--muted)}.message.error{color:var(--bad)}.message.ok{color:var(--ok)}.hidden{display:none!important}
    .map{padding:20px;margin-bottom:14px}.maphead{display:flex;gap:18px;justify-content:space-between}.map h2{margin:0 0 5px;font-size:23px}.diff{color:var(--cyan);font-size:25px;font-weight:800}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}.path{margin-top:12px;color:#69758c;font-size:12px;overflow-wrap:anywhere}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:12px}.toolbar p{margin:0;color:var(--muted)}.toolbar .buttons{display:flex;gap:8px}
    .axes{display:grid;gap:10px}.axis{display:grid;grid-template-columns:minmax(180px,1.1fr) 100px minmax(260px,2fr) 145px;align-items:center;gap:18px;padding:14px 16px}.axis-name b{display:block;font-size:16px}.axis-name small{color:var(--muted)}.machine{font-size:23px;font-weight:800;text-align:center}.machine.extreme{color:var(--warn)}.rating{display:grid;grid-template-columns:auto 1fr 70px;align-items:center;gap:10px}.rating input[type=range]{width:100%;accent-color:var(--cyan)}.rating input[type=number]{width:70px;border:1px solid var(--line);border-radius:8px;background:#0d121b;color:var(--text);padding:7px}.rating.disabled{opacity:.42}.qualifier{border:1px solid var(--line);border-radius:9px;background:#0d121b;color:var(--text);padding:8px;width:100%}
    .savebox{margin-top:14px;padding:16px;display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#0d121b;color:var(--text);padding:9px}.field textarea{resize:vertical;min-height:42px}.saved{color:var(--ok);font-weight:700}
    @media(max-width:850px){.top,.maphead{align-items:start;flex-direction:column}.axis{grid-template-columns:1fr 78px}.rating{grid-column:1/-1}.savebox{grid-template-columns:1fr}.toolbar{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><div class="eyebrow">osu!standard · local assisted review</div><h1>BID 评审台</h1><div class="sub">输入 BID，自动定位本地 .osu、运行 Map Demand，然后只评价你有把握的维度。15★以上统一显示为 15+，未压缩尾部只作为内部诊断。</div></div><div class="status" id="status">正在载入…</div></div>
  <form class="search" id="search"><input id="bid" inputmode="numeric" autocomplete="off" placeholder="输入 Beatmap ID，例如 4437056" aria-label="Beatmap ID"><button id="analyze">分析</button><div class="modbar"><span class="caption">难度</span><label><input type="radio" name="difficultyMod" value="" checked><span>NM</span></label><label><input type="radio" name="difficultyMod" value="EZ"><span>EZ</span></label><label><input type="radio" name="difficultyMod" value="HR"><span>HR</span></label><span class="modsep"></span><label><input id="hiddenMod" type="checkbox" value="HD"><span>HD</span></label><span class="modsep"></span><span class="caption">速度</span><label><input type="radio" name="speedMod" value="" checked><span>1.0×</span></label><label><input type="radio" name="speedMod" value="HT"><span>HT</span></label><label><input type="radio" name="speedMod" value="DT"><span>DT</span></label></div></form>
  <div class="message" id="message"></div>
  <section id="workspace" class="hidden">
    <div class="map"><div class="maphead"><div><h2 id="mapTitle"></h2><div id="mapVersion" class="sub"></div></div><div id="localStars" class="diff"></div></div><div class="meta" id="meta"></div><div class="path" id="path"></div></div>
    <div class="toolbar"><p>程序结果用于对照，不代表真值。可以一键填入后只修正有问题的轴。</p><div class="buttons"><button class="button secondary" id="clear" type="button">全部设为暂不评价</button><button class="button secondary" id="accept" type="button">用程序值填充全部</button></div></div>
    <div class="axes" id="axes"></div>
    <div class="savebox"><div class="field"><label for="confidence">确定程度</label><select id="confidence"><option value="">未填写</option><option value="LOW">不太确定</option><option value="MEDIUM">比较确定</option><option value="HIGH">很确定</option></select></div><div class="field"><label for="notes">备注</label><textarea id="notes" maxlength="4000" placeholder="例如：Finger Control 暂不适合用星级衡量"></textarea></div><button class="button" id="save" type="button">保存评价</button></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);let state=null,analysis=null,ratings={};
const help={jump_aim:'离散跳跃移动',flow_aim:'连续流动瞄准',aim_control:'方向与速度变化控制',spatial_precision:'落点容错与精确度',raw_speed:'峰值点击速度',stamina:'高强度段内持续承压',endurance:'整张图长期维持稳定性',finger_control:'左手节奏与指法控制',reading:'实时视觉解析'};
function msg(text,type=''){const el=$('#message');el.textContent=text;el.className=`message ${type}`}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function request(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'请求失败');return d}
function updateStatus(){if(state)$('#status').textContent=`${state.release?.label||state.map_demand_version||state.algorithm_id} · ${state.indexed_beatmaps.toLocaleString()} 张已索引 · ${state.saved_responses} 条评价`}
async function init(){state=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());updateStatus();$('#bid').focus()}
function selectedMods(){const mods=[],difficulty=document.querySelector('input[name="difficultyMod"]:checked')?.value,speed=document.querySelector('input[name="speedMod"]:checked')?.value;if(difficulty)mods.push(difficulty);if($('#hiddenMod').checked)mods.push('HD');if(speed)mods.push(speed);return mods}
function modLabel(){const mods=analysis.mod_context?.requested_mods||[];return mods.length?mods.join(''): 'NM'}
$('#search').addEventListener('submit',async e=>{e.preventDefault();const bid=$('#bid').value.trim(),mods=selectedMods(),label=mods.length?mods.join(''):'NM';if(!/^\d+$/.test(bid)){msg('请输入有效 BID','error');return}$('#analyze').disabled=true;msg(`正在定位并分析 BID ${bid} +${label}…`);try{analysis=await request('/api/analyze',{beatmap_id:Number(bid),mods});render();msg(`+${modLabel()} 分析完成。请评价有把握的维度。`,'ok')}catch(err){$('#workspace').classList.add('hidden');msg(err.message,'error')}finally{$('#analyze').disabled=false}});
function render(){const b=analysis.beatmap,m=b.metadata||{},ctx=analysis.analysis_context||{},rate=Number(ctx.clock_rate||1),effective=ctx.difficulty||m.difficulty||{},duplicateCount=b.duplicate_local_paths?.length||0;$('#mapTitle').textContent=`${b.artist||'—'} — ${b.title||'—'}`;$('#mapVersion').textContent=`[${b.version||'—'}] · ${b.creator||'—'} · BID ${b.beatmap_id} · +${modLabel()}`;$('#localStars').textContent=b.local_nm_stars==null?`+${modLabel()} · NM ★ —`:`+${modLabel()} · 本地 NM ★ ${Number(b.local_nm_stars).toFixed(3)}`;$('#meta').innerHTML=[['BPM',ctx.bpm_max==null?m.bpm_max:Number(ctx.bpm_max).toFixed(1)],['AR',effective.ApproachRate??effective.AR],['OD',effective.OverallDifficulty??effective.OD],['CS',effective.CircleSize??effective.CS],['速度',`${rate}×`],['物件',m.counts?.objects],['长度',ctx.duration_ms==null?null:`${Math.floor(ctx.duration_ms/60000)}:${String(Math.floor(ctx.duration_ms/1000)%60).padStart(2,'0')}`],...(duplicateCount>1?[['本地副本',`${duplicateCount} 份（内容相同）`]]:[])].map(([k,v])=>`<span class="chip">${k} ${v??'—'}</span>`).join('');$('#path').textContent=b.path_abs;ratings=Object.fromEntries(state.axes.map(a=>[a.key,{qualifier:'SKIP',value:null}]));$('#axes').innerHTML=state.axes.map(axisRow).join('');bindRows();$('#workspace').classList.remove('hidden')}
function controlNote(machine){if(machine.public_value_semantics!=='EXPERIMENTAL_ESTABLISHED_LOCAL_CONTROL_EXECUTION')return '';const clock=ms=>`${Math.floor(ms/60000)}:${(ms/1000%60).toFixed(2).padStart(5,'0')}`,p=machine.peak_window,parts=['最难局部的控制需求'];if(p)parts.push(`${clock(p.start_ms)}–${clock(p.end_ms)}`);if(machine.stars==null)parts.push('证据不足');else if(machine.mechanism_coverage?.status==='PARTIAL')parts.push('方向证据不完整');return `<br><small>${esc(parts.join(' · '))}</small>`}
function axisRow(a){const machine=analysis.axes[a.key],bounded=a.unit==='bounded_0_10',max=Number(a.max_value||15),suffix=bounded?'/10':'★';return `<div class="axis" data-row="${a.key}"><div class="axis-name"><b>${esc(a.label)}</b><small>${esc(help[a.key])}</small>${controlNote(machine)}</div><div class="machine ${!bounded&&machine.stars>=state.display_ceiling_stars?'extreme':''}">${esc(machine.display)}${suffix}</div><div class="rating disabled"><input class="enabled" type="checkbox" aria-label="评价 ${esc(a.label)}"><input class="slider" type="range" min="0" max="${max}" step="0.1" value="5" disabled><input class="number" type="number" min="0" max="${max}" step="0.1" value="5" disabled></div><select class="qualifier" disabled><option value="APPROXIMATE">约等于</option><option value="AT_LEAST">至少</option></select></div>`}
function bindRows(){document.querySelectorAll('[data-row]').forEach(row=>{const key=row.dataset.row,enabled=row.querySelector('.enabled'),slider=row.querySelector('.slider'),number=row.querySelector('.number'),qual=row.querySelector('.qualifier');enabled.onchange=()=>{const on=enabled.checked;slider.disabled=number.disabled=qual.disabled=!on;row.querySelector('.rating').classList.toggle('disabled',!on);ratings[key]=on?{qualifier:qual.value,value:Number(number.value)}:{qualifier:'SKIP',value:null}};slider.oninput=()=>{number.value=slider.value;ratings[key]={qualifier:qual.value,value:Number(slider.value)}};number.oninput=()=>{if(Number(number.value)<=Number(slider.max))slider.value=number.value;ratings[key]={qualifier:qual.value,value:Number(number.value)}};qual.onchange=()=>ratings[key]={qualifier:qual.value,value:Number(number.value)}})}
$('#clear').onclick=()=>{document.querySelectorAll('[data-row]').forEach(row=>{const enabled=row.querySelector('.enabled');if(enabled.checked){enabled.checked=false;enabled.dispatchEvent(new Event('change'))}})};
$('#accept').onclick=()=>{state.axes.forEach(a=>{if(analysis.axes[a.key].stars==null)return;const row=document.querySelector(`[data-row="${a.key}"]`),raw=Number(analysis.axes[a.key].stars),value=Math.min(raw,state.display_ceiling_stars),qual=raw>=state.display_ceiling_stars?'AT_LEAST':'APPROXIMATE';row.querySelector('.enabled').checked=true;row.querySelector('.slider').value=value;row.querySelector('.number').value=value.toFixed(1);row.querySelector('.qualifier').value=qual;row.querySelector('.enabled').dispatchEvent(new Event('change'));ratings[a.key]={qualifier:qual,value:Number(value.toFixed(1))}})};
$('#save').onclick=async()=>{if(!analysis)return;$('#save').disabled=true;msg('正在保存评价…');try{const result=await request('/api/response',{analysis_id:analysis.analysis_id,ratings,confidence:$('#confidence').value||null,notes:$('#notes').value});state.saved_responses=result.saved_responses;updateStatus();msg(`已保存：${result.response_id}`,'ok');$('#bid').select()}catch(err){msg(err.message,'error')}finally{$('#save').disabled=false}};
init().catch(err=>msg(`页面初始化失败：${err.message}`,'error'));
</script>
</body>
</html>
