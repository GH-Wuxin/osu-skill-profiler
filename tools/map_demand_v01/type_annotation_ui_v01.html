<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Profiler · 类型标注</title>
<style>
:root{color-scheme:dark;--bg:#080c13;--panel:#101722;--panel2:#151f2d;--line:#29384d;--text:#eef4ff;--muted:#8d9bb0;--cyan:#45d6dc;--gold:#ffc65d;--pink:#ff6fb1;--red:#ff657d;--green:#65dc9a;--blue:#6a8cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#132439 0,#080c13 45%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;padding:14px 20px;background:rgba(8,12,19,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.search{display:grid;grid-template-columns:170px 1fr auto;gap:12px;align-items:center;max-width:1600px;margin:auto}.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--cyan)}.query{display:flex;gap:8px;align-items:center;background:#0c131e;border:1px solid var(--line);border-radius:10px;padding:7px}.query input[type=number]{width:130px;background:transparent;border:0;color:white;font-size:17px;font-weight:700;outline:0}.mods{display:flex;gap:4px;flex-wrap:wrap}.mods label{position:relative}.mods input{position:absolute;opacity:0}.mods span{display:block;padding:6px 9px;border:1px solid #33455d;border-radius:6px;color:#9aa9bd;font-weight:800}.mods input:checked+span{color:#081119;background:var(--gold);border-color:var(--gold)}.primary-btn{border:0;border-radius:8px;padding:9px 16px;background:var(--cyan);color:#051012;font-weight:800}.primary-btn:disabled{opacity:.45}.status{max-width:1600px;margin:8px auto 0;color:var(--muted);min-height:20px}.status.error{color:var(--red)}.status.ok{color:var(--green)}main{max-width:1600px;margin:0 auto;padding:18px 20px 40px}.hidden{display:none!important}.map-head{display:grid;grid-template-columns:1fr auto;gap:18px;padding:0 2px 15px;border-bottom:1px solid var(--line)}h1{font-size:25px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted)}.facts{display:flex;gap:18px;align-items:center}.fact b{display:block;font-size:18px;color:var(--gold)}.fact small{color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(620px,1.15fr) minmax(470px,.85fr);gap:16px;margin-top:16px}.viewer,.editor,.summary{border:1px solid var(--line);background:rgba(13,20,31,.88)}.viewer{padding:14px}.playfield-shell{position:relative;width:100%;aspect-ratio:4/3;background:#02050a;overflow:hidden;border:1px solid #354960}.playfield-shell img{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(.34) blur(2px);transform:scale(1.01)}canvas{display:block}.playfield{position:absolute;inset:0;width:100%;height:100%}.controls{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;margin:12px 0}.icon-btn{height:34px;min-width:44px;border:1px solid #354960;background:#121d2a;color:white;border-radius:6px}.time{font-variant-numeric:tabular-nums;color:#cbd5e4}.slider{width:100%;accent-color:var(--cyan)}.audio-controls{display:flex;gap:12px;color:var(--muted);font-size:12px;align-items:center}.audio-controls input[type=range]{width:90px}.axis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.axis{padding:7px 9px;background:#0a111b;border-left:2px solid var(--cyan)}.axis-head{display:flex;justify-content:space-between;gap:8px}.axis-name{color:#b8c6d9;font-size:12px}.axis-value{font-weight:800;color:var(--gold)}.axis-track{height:4px;background:#263445;margin-top:5px}.axis-fill{height:100%;background:var(--cyan)}.axis-unavailable{color:var(--muted);grid-column:1/-1}.timeline-wrap{position:relative;border:1px solid #304157;background:#080d15;margin-top:12px}.timeline{width:100%;height:106px;touch-action:none}.legend{display:flex;gap:12px;color:var(--muted);font-size:12px;margin-top:8px}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:4px}.hint{margin-top:8px;color:var(--muted);font-size:12px}.editor{min-height:760px;display:flex;flex-direction:column}.editor-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.editor-head h2{font-size:16px;margin:0}.section-list{padding:10px;overflow:auto;max-height:930px}.section-card{border:1px solid #2b3c52;background:#0d141f;margin-bottom:8px}.section-card.active{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(69,214,220,.25)}.section-title{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:9px 10px;background:#121c29}.section-title b{color:var(--cyan)}.section-title .stats{color:var(--muted);font-size:12px;white-space:nowrap}.section-actions{display:flex;gap:4px}.mini{border:1px solid #394b62;background:#0c141f;color:#cbd5e4;border-radius:4px;padding:3px 7px}.section-body{padding:10px;display:grid;gap:10px}.proposal{padding:8px 9px;border-left:2px solid var(--gold);background:#16150f;color:#c7d1df;font-size:12px}.proposal b{color:var(--gold);margin-right:6px}.proposal.edited{border-color:var(--cyan);background:#0d171a}.proposal ul{margin:5px 0 0;padding-left:18px;color:var(--muted)}.time-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label,.label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:5px}.field input,.field select,.field textarea,.summary input,.summary select,.summary textarea{width:100%;background:#080e17;border:1px solid #304157;color:white;padding:7px;border-radius:5px}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks{display:flex;gap:6px;flex-wrap:wrap}.check{position:relative}.check input{position:absolute;opacity:0}.check span{display:block;padding:5px 7px;border:1px solid #35465d;border-radius:4px;color:#9dacc0;font-size:12px}.check input:checked+span{border-color:var(--cyan);color:var(--cyan);background:#10252d}.check input:disabled+span{opacity:.35}.contrib{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.contrib button{border:1px solid #34465d;background:#0a111b;color:#9cabc0;padding:6px 3px;border-radius:4px;font-size:12px}.contrib button.selected{background:var(--gold);border-color:var(--gold);color:#151006;font-weight:800}.gimmick{padding:8px;border-left:2px solid var(--pink);background:#15101a}.summary{margin-top:16px;padding:14px}.summary h2{font-size:16px;margin:0 0 12px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary .wide{grid-column:1/-1}.save-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.path{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px}.download{color:var(--gold)}
@media(max-width:1100px){.workspace{grid-template-columns:1fr}.editor{min-height:0}.section-list{max-height:none}.search{grid-template-columns:1fr}.facts{display:none}}
</style>
</head>
<body>
<header class="top">
  <form id="search" class="search">
    <div class="brand">SKILL <span>TYPE LAB</span></div>
    <div class="query">
      <input id="bid" type="number" min="1" placeholder="输入 BID" required>
      <div class="mods">
        <label><input name="diff" type="radio" value="" checked><span>NM</span></label>
        <label><input name="diff" type="radio" value="EZ"><span>EZ</span></label>
        <label><input name="diff" type="radio" value="HR"><span>HR</span></label>
        <label><input id="hd" type="checkbox" value="HD"><span>HD</span></label>
        <label><input name="speed" type="radio" value="" checked><span>1×</span></label>
        <label><input name="speed" type="radio" value="DT"><span>DT</span></label>
        <label><input name="speed" type="radio" value="HT"><span>HT</span></label>
      </div>
    </div>
    <button id="analyze" class="primary-btn">载入谱面</button>
  </form>
  <div id="status" class="status">正在初始化…</div>
</header>
<main>
  <section id="content" class="hidden">
    <div class="map-head">
      <div><h1 id="title"></h1><div id="subtitle" class="sub"></div></div>
      <div class="facts"><div class="fact"><b id="modFact">NM</b><small>MOD</small></div><div class="fact"><b id="objectFact">—</b><small>OBJECTS</small></div><div class="fact"><b id="sectionFact">—</b><small>SECTIONS</small></div></div>
    </div>
    <div class="workspace">
      <section class="viewer">
        <div class="playfield-shell"><img id="bg" class="hidden" alt=""><canvas id="playfield" class="playfield" width="1024" height="768"></canvas></div>
        <div class="controls"><button id="play" class="icon-btn" type="button">▶</button><input id="seek" class="slider" type="range" min="0" max="1" step="1"><span id="clock" class="time">0:00.000</span><button id="loop" class="icon-btn" type="button">区段循环</button></div>
        <div class="audio-controls"><label>音乐 <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="0.3"></label><label>Hitsound <input id="hitVolume" type="range" min="0" max="1" step="0.01" value="0.3"></label><label><input id="ghost" type="checkbox"> 显示区段完整排列</label><span id="audioState" class="pill"></span></div>
        <div id="axes" class="axis-grid"></div>
        <div class="timeline-wrap"><canvas id="timeline" class="timeline" width="1200" height="106"></canvas></div>
        <div class="legend"><span><i class="dot" style="background:#45d6dc"></i>当前区段</span><span><i class="dot" style="background:#ffc65d"></i>主要/决定性难点</span><span>拖动区段边界 · 双击拆分 · 单击跳转</span></div>
        <div class="hint">播放器按所选 DT/HT 真实变速；本地自定义 hitsound 会优先播放，其余使用简化反馈音。</div>
      </section>
      <section class="editor"><div class="editor-head"><h2>区段标注</h2><span id="saved" class="pill"></span></div><div id="sections" class="section-list"></div></section>
    </div>
    <section class="summary">
      <h2>整图结论</h2>
      <div class="summary-grid">
        <div class="field"><label>主难度类型</label><select id="summaryPrimary"></select></div>
        <div class="field"><label>Gimmick 子类型</label><select id="summaryGimmick"></select></div>
        <div class="wide"><span class="label">次要难度类型（最多三个）</span><div id="summarySecondary" class="checks"></div></div>
        <div class="wide"><span class="label">主体构成（可以和主难度不同）</span><div id="summaryComposition" class="checks"></div></div>
        <div class="field wide"><label>补充说明</label><textarea id="summaryNotes" rows="2" placeholder="例如：大部分是简单 Jump，难度集中在结尾 Stream。"></textarea></div>
      </div>
      <div class="save-row"><div id="path" class="path"></div><button id="save" class="primary-btn" type="button">保存本次标注</button></div>
    </section>
  </section>
</main>
<audio id="audio" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const typeLabel={UNLABELED:'未标注',NONE:'人工确认无明显主类型',JUMP:'Jump',STREAM:'Stream',ALT:'Alt',TECH:'Tech',GIMMICK:'Gimmick'};
const contributionLabel={SETUP:'铺垫',NORMAL:'一般',MAJOR:'主要难点',DECISIVE:'决定性难点'};
const gimmickLabel={LOW_AR_READING:'Low AR Reading',ODD_RHYTHM:'Odd Rhythm',OVERLAP:'Overlap',VISUAL_DECEPTION:'Visual Deception',SLIDER_TECH:'Slider Tech',EZ_READING:'EZ Reading',OTHER_PENDING:'其他 / 待定义'};
const tagLabel={BURST_HEAVY:'Burst-heavy',SLIDER_TECH:'Slider Tech',SPEED_CHANGE:'变速',ANGLE_CHANGE:'连续大幅变角',SPACING_CHANGE:'变距',SEPARATION:'分离',DENSITY_SPIKE:'密度突增',DIFFICULTY_SPIKE:'局部难度峰值'};
let appState=null,analysis=null,sections=[],activeIndex=0,dragBoundary=null,loopSection=true,lastClock=0,raf=0,audioCtx=null,buffers=new Map();
const audio=$('#audio'),pf=$('#playfield'),pctx=pf.getContext('2d'),tl=$('#timeline'),tctx=tl.getContext('2d');
function msg(text,kind=''){const el=$('#status');el.textContent=text;el.className='status '+kind}
function request(url,body){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(`${d.error||'ERROR'}: ${d.message||'请求失败'}`);return d})}
function fmt(ms){ms=Math.max(0,Number(ms)||0);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,z=Math.floor(ms%1000);return `${m}:${String(s).padStart(2,'0')}.${String(z).padStart(3,'0')}`}
function mods(){const out=[],d=$('input[name=diff]:checked').value,s=$('input[name=speed]:checked').value;if(d)out.push(d);if($('#hd').checked)out.push('HD');if(s)out.push(s);return out}
function modText(){const m=analysis?.mod_context?.requested_mods||mods();return m.length?m.join(''):'NM'}
function options(values,labels,selected){return values.map(v=>`<option value="${v}" ${v===selected?'selected':''}>${labels[v]||v}</option>`).join('')}
function checks(values,labels,selected,cls){const set=new Set(selected||[]);return values.map(v=>`<label class="check"><input class="${cls}" type="checkbox" value="${v}" ${set.has(v)?'checked':''}><span>${labels[v]||v}</span></label>`).join('')}
function setChecks(selector,values){const selected=new Set(values||[]);$$(selector).forEach(x=>x.checked=selected.has(x.value))}
async function init(){appState=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());$('#saved').textContent=`${appState.saved_annotations} 条已保存`;$('#summaryPrimary').innerHTML=options(['UNLABELED',...appState.primary_types],typeLabel,'UNLABELED');$('#summaryGimmick').innerHTML=options(['',...appState.gimmick_subtypes],gimmickLabel,'');$('#summarySecondary').innerHTML=checks(appState.primary_types.filter(x=>x!=='NONE'),typeLabel,[],'summary-secondary');$('#summaryComposition').innerHTML=checks(appState.primary_types.filter(x=>x!=='NONE'),typeLabel,[],'summary-composition');msg(`${appState.indexed_beatmaps.toLocaleString()} 张本地谱面已索引 · 缺图${appState.downloads_enabled?'会下载完整 .osz 到私有缓存':'不会联网下载'}`);$('#bid').focus()}
$('#search').onsubmit=async e=>{e.preventDefault();const bid=$('#bid').value.trim();if(!/^\d+$/.test(bid))return msg('请输入有效 BID','error');$('#analyze').disabled=true;msg(`正在载入 BID ${bid} +${mods().join('')||'NM'}；缺图时完整谱面下载可能需要一点时间…`);try{analysis=await request('/api/analyze',{beatmap_id:Number(bid),mods:mods()});loadAnalysis();msg(`载入完成：自动提出 ${sections.length} 个区段，请边听边修正。`,'ok')}catch(err){msg(err.message,'error')}finally{$('#analyze').disabled=false}};
function loadAnalysis(){const b=analysis.beatmap,p=analysis.preview;sections=analysis.suggested_sections.map((s,i)=>{const m=s.machine_proposal||{},proposed=m.status==='PROPOSED';return {...s,section_id:s.section_id||`s${i+1}`,primary_type:proposed?m.primary_type:'UNLABELED',secondary_types:proposed?[...(m.secondary_types||[])]:[],gimmick_subtype:proposed?m.gimmick_subtype:null,structural_tags:[...(m.structural_tags||[])],contribution:m.contribution||'NORMAL',notes:'',review_state:'MACHINE_PROPOSAL'}});const sm=analysis.machine_summary||{},summaryProposed=sm.status==='PROPOSED';$('#summaryPrimary').value=summaryProposed?sm.primary_type:'UNLABELED';setChecks('.summary-secondary',summaryProposed?sm.secondary_types:[]);setChecks('.summary-composition',sm.composition_types||[]);$('#summaryGimmick').value=summaryProposed?(sm.gimmick_subtype||''):'';updateSummaryGimmick();activeIndex=0;$('#title').textContent=`${b.artist||'—'} — ${b.title||'—'}`;$('#subtitle').textContent=`[${b.version||'—'}] · mapped by ${b.creator||'—'} · BID ${b.beatmap_id}`;$('#modFact').textContent=modText();$('#objectFact').textContent=p.objects.length;$('#path').textContent=b.path_abs;$('#bg').classList.toggle('hidden',!p.background_url);if(p.background_url)$('#bg').src=p.background_url;audio.pause();audio.src=p.audio_url||'';audio.playbackRate=p.clock_rate;audio.preservesPitch=false;audio.volume=Number($('#musicVolume').value);$('#audioState').textContent=p.audio_available?'音乐可用':'音乐缺失';$('#audioState').classList.toggle('download',!p.audio_available);$('#seek').min=p.start_ms;$('#seek').max=p.end_ms;$('#seek').value=p.start_ms;lastClock=p.start_ms;buffers.clear();renderAxes();renderSections();drawTimeline();drawPlayfield(p.start_ms);$('#content').classList.remove('hidden');cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function renderAxes(){const demand=analysis.map_demand||{},axes=demand.axes||{};if(demand.status!=='OK'||!Object.keys(axes).length){$('#axes').innerHTML='<div class="axis-unavailable">九维分析暂不可用</div>';return}const meta=new Map((appState.axes||[]).map(x=>[x.key,x]));$('#axes').innerHTML=(appState.axes||[]).map(info=>{const item=axes[info.key]||{},value=Number(item.stars),max=item.unit==='bounded_0_10'?10:15,width=Number.isFinite(value)?Math.max(0,Math.min(100,value/max*100)):0;return `<div class="axis"><div class="axis-head"><span class="axis-name">${info.label}</span><span class="axis-value">${item.display||'—'}${item.unit==='bounded_0_10'?'/10':'★'}</span></div><div class="axis-track"><div class="axis-fill" style="width:${width}%"></div></div></div>`}).join('')}
function currentMs(){if(audio.src&&Number.isFinite(audio.currentTime))return audio.currentTime*1000/analysis.preview.clock_rate;return Number($('#seek').value)}
function seek(ms){const p=analysis.preview,t=Math.max(p.start_ms,Math.min(p.end_ms,Number(ms)));if(audio.src)audio.currentTime=t*p.clock_rate/1000;$('#seek').value=t;lastClock=t;drawPlayfield(t);drawTimeline(t);$('#clock').textContent=fmt(t)}
$('#seek').oninput=e=>seek(e.target.value);$('#musicVolume').oninput=e=>audio.volume=Number(e.target.value);$('#play').onclick=async()=>{if(!audio.src)return msg('这张图没有可播放的完整音乐。','error');if(audio.paused){await audio.play();$('#play').textContent='❚❚'}else{audio.pause();$('#play').textContent='▶'}};audio.onpause=()=>$('#play').textContent='▶';audio.onplay=()=>$('#play').textContent='❚❚';$('#loop').onclick=()=>{loopSection=!loopSection;$('#loop').textContent=loopSection?'区段循环':'整图播放';$('#loop').style.color=loopSection?'var(--gold)':''};
function activeSection(){return sections[Math.min(activeIndex,sections.length-1)]}
function frame(){if(analysis){let now=currentMs(),s=activeSection();if(!audio.paused&&loopSection&&s&&now>s.end_ms){seek(s.start_ms);now=s.start_ms}if(!audio.paused)triggerHits(lastClock,now);lastClock=now;$('#seek').value=now;$('#clock').textContent=fmt(now);drawPlayfield(now);drawTimeline(now)}raf=requestAnimationFrame(frame)}
function drawPlayfield(now){const p=analysis.preview,scale=2;pctx.clearRect(0,0,pf.width,pf.height);pctx.save();pctx.scale(scale,scale);const visible=p.objects.filter(o=>now>=o.start_ms-p.approach_preempt_ms&&now<=o.end_ms+260);const active=activeSection();if($('#ghost').checked&&active){pctx.globalAlpha=.16;for(const o of p.objects.filter(o=>o.start_ms>=active.start_ms&&o.start_ms<=active.end_ms))drawObject(o,now,p,true);pctx.globalAlpha=1}for(const o of visible.filter(o=>o.type==='slider'))drawObject(o,now,p,false);for(const o of visible.filter(o=>o.type!=='slider'))drawObject(o,now,p,false);pctx.restore()}
function colorFor(combo){return ['#45d6dc','#ff6fb1','#ffc65d','#8b7dff'][combo%4]}
function drawObject(o,now,p,ghost){const r=p.circle_radius_px,c=colorFor(o.combo),alpha=ghost?1:Math.max(.18,Math.min(1,(now-(o.start_ms-p.approach_preempt_ms))/260));pctx.save();pctx.globalAlpha*=alpha;if(o.slider_path.length){pctx.lineCap='round';pctx.lineJoin='round';pctx.strokeStyle='rgba(0,0,0,.78)';pctx.lineWidth=r*1.45;pctx.beginPath();o.slider_path.forEach((q,i)=>i?pctx.lineTo(q[0],q[1]):pctx.moveTo(q[0],q[1]));pctx.stroke();pctx.strokeStyle=c;pctx.lineWidth=r*.9;pctx.stroke()}if(o.type==='spinner'){pctx.strokeStyle=c;pctx.lineWidth=4;pctx.beginPath();pctx.arc(256,192,125,0,Math.PI*2);pctx.stroke()}else{pctx.fillStyle='rgba(12,18,28,.88)';pctx.strokeStyle=c;pctx.lineWidth=3;pctx.beginPath();pctx.arc(o.x,o.y,r,0,Math.PI*2);pctx.fill();pctx.stroke();pctx.fillStyle='#fff';pctx.font=`700 ${Math.max(12,r*.72)}px Segoe UI`;pctx.textAlign='center';pctx.textBaseline='middle';pctx.fillText(o.combo_number,o.x,o.y);if(!ghost&&now<o.start_ms){const progress=(o.start_ms-now)/p.approach_preempt_ms;pctx.globalAlpha*=.72;pctx.strokeStyle='#fff';pctx.lineWidth=2;pctx.beginPath();pctx.arc(o.x,o.y,r*(1+2.1*progress),0,Math.PI*2);pctx.stroke()}}pctx.restore()}
async function triggerHits(from,to){if(to<from||to-from>500)return;for(const o of analysis.preview.objects){if(o.start_ms>from&&o.start_ms<=to){if(o.sample_keys.length){for(const key of o.sample_keys)playSample(key)}else beep(o.hit_sound)}}}
async function ensureAudioCtx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx}
async function playSample(key){try{const ctx=await ensureAudioCtx();let b=buffers.get(key);if(!b){const data=await fetch(analysis.preview.sample_url_prefix+key).then(r=>r.arrayBuffer());b=await ctx.decodeAudioData(data);buffers.set(key,b)}const src=ctx.createBufferSource(),gain=ctx.createGain();src.buffer=b;gain.gain.value=Number($('#hitVolume').value);src.connect(gain).connect(ctx.destination);src.start()}catch{beep(0)}}
async function beep(bits){const ctx=await ensureAudioCtx(),gain=ctx.createGain(),osc=ctx.createOscillator();osc.type=bits&4?'square':'sine';osc.frequency.value=bits&2?1100:bits&8?680:850;gain.gain.setValueAtTime(Number($('#hitVolume').value)*.13,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.045);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.05)}
function drawTimeline(now=currentMs()){if(!analysis)return;const p=analysis.preview,w=tl.width,h=tl.height,span=p.end_ms-p.start_ms,x=t=>(t-p.start_ms)/span*w;tctx.clearRect(0,0,w,h);tctx.fillStyle='#080d15';tctx.fillRect(0,0,w,h);const bins=new Array(240).fill(0);for(const o of p.objects){const i=Math.max(0,Math.min(239,Math.floor((o.start_ms-p.start_ms)/span*240)));bins[i]++}const max=Math.max(...bins,1);tctx.fillStyle='#40566f';bins.forEach((v,i)=>tctx.fillRect(i*w/240,h-22-v/max*55,w/240-1,v/max*55));sections.forEach((s,i)=>{const a=x(s.start_ms),b=x(s.end_ms);tctx.fillStyle=i===activeIndex?'rgba(69,214,220,.24)':s.contribution==='MAJOR'||s.contribution==='DECISIVE'?'rgba(255,198,93,.18)':'rgba(255,255,255,.025)';tctx.fillRect(a,0,Math.max(2,b-a),h);tctx.strokeStyle=i===activeIndex?'#45d6dc':'#29384d';tctx.strokeRect(a+.5,.5,Math.max(1,b-a-1),h-1);if(i>0){tctx.fillStyle=i===activeIndex?'#45d6dc':'#71839b';tctx.beginPath();tctx.moveTo(a-6,0);tctx.lineTo(a+6,0);tctx.lineTo(a,9);tctx.fill()}tctx.fillStyle='#d7e2f2';tctx.font='11px Segoe UI';tctx.fillText(String(i+1),a+5,14)});const cx=x(now);tctx.strokeStyle='#ff6fb1';tctx.lineWidth=2;tctx.beginPath();tctx.moveTo(cx,0);tctx.lineTo(cx,h);tctx.stroke()}
function timelineMs(e){const r=tl.getBoundingClientRect(),ratio=(e.clientX-r.left)/r.width,p=analysis.preview;return p.start_ms+Math.max(0,Math.min(1,ratio))*(p.end_ms-p.start_ms)}
tl.onpointerdown=e=>{const t=timelineMs(e),span=analysis.preview.end_ms-analysis.preview.start_ms,tol=span*12/tl.clientWidth;let nearest=-1,dist=Infinity;for(let i=1;i<sections.length;i++){const d=Math.abs(sections[i].start_ms-t);if(d<dist){dist=d;nearest=i}}if(dist<=tol){dragBoundary=nearest;tl.setPointerCapture(e.pointerId)}else{const idx=sections.findIndex(s=>t>=s.start_ms&&t<=s.end_ms);if(idx>=0){activeIndex=idx;renderSections()}seek(t)}drawTimeline()};
tl.onpointermove=e=>{if(dragBoundary==null)return;const t=timelineMs(e),prev=sections[dragBoundary-1],next=sections[dragBoundary],min=120;const value=Math.max(prev.start_ms+min,Math.min(next.end_ms-min,t));prev.end_ms=value;next.start_ms=value;markEdited(prev);markEdited(next);renderSections(false);drawTimeline()};tl.onpointerup=()=>dragBoundary=null;tl.ondblclick=e=>{const t=timelineMs(e),idx=sections.findIndex(s=>t>s.start_ms+200&&t<s.end_ms-200);if(idx>=0)splitSection(idx,t)};
function renderSections(scroll=true){$('#sectionFact').textContent=sections.length;$('#sections').innerHTML=sections.map((s,i)=>sectionCard(s,i)).join('');bindSectionEvents();if(scroll)document.querySelector(`.section-card[data-i="${activeIndex}"]`)?.scrollIntoView({block:'nearest'});drawTimeline()}
function sectionCard(s,i){const st=s.stats||{},machine=s.machine_proposal||{},secondary=checks(appState.primary_types.filter(x=>x!=='NONE'&&x!==s.primary_type),typeLabel,s.secondary_types,'section-secondary'),tags=checks(appState.structural_tags,tagLabel,s.structural_tags,'section-tag'),gimmick=s.primary_type==='GIMMICK'||s.secondary_types.includes('GIMMICK'),edited=s.review_state==='HUMAN_EDITED',evidence=(machine.evidence||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join(''),proposalText=machine.status==='PROPOSED'?`机器初判：${typeLabel[machine.primary_type]||machine.primary_type}`:'机器证据不足，等待人工判断';return `<article class="section-card ${i===activeIndex?'active':''}" data-i="${i}"><div class="section-title"><b>#${i+1}</b><span class="stats">${fmt(s.start_ms)}–${fmt(s.end_ms)} · ${st.objects||objectsIn(s).length} objects</span><div class="section-actions"><button class="mini play-section">▶</button><button class="mini split">拆</button><button class="mini merge" ${i===0?'disabled':''}>并</button><button class="mini remove" ${sections.length===1?'disabled':''}>删</button></div></div><div class="section-body"><div class="proposal ${edited?'edited':''}"><b>${edited?'已人工修改':'机器建议'}</b>${proposalText}${evidence?`<ul>${evidence}</ul>`:''}</div><div class="time-edit"><div class="field"><label>开始 ms</label><input class="start" type="number" step="1" value="${Math.round(s.start_ms)}"></div><div class="field"><label>结束 ms</label><input class="end" type="number" step="1" value="${Math.round(s.end_ms)}"></div></div><div class="types"><div class="field"><label>区段主类型</label><select class="primary">${options(['UNLABELED',...appState.primary_types],typeLabel,s.primary_type)}</select></div><div><span class="label">难度贡献</span><div class="contrib">${appState.contributions.map(v=>`<button type="button" data-v="${v}" class="${s.contribution===v?'selected':''}">${contributionLabel[v]}</button>`).join('')}</div></div></div><div><span class="label">次类型（最多三个）</span><div class="checks secondary-box">${secondary}</div></div><div><span class="label">结构标签</span><div class="checks">${tags}</div></div><div class="gimmick ${gimmick?'':'hidden'}"><div class="field"><label>Gimmick 子类型（必选）</label><select class="gimmick-select">${options(appState.gimmick_subtypes,gimmickLabel,s.gimmick_subtype||'')}</select></div></div><div class="field"><label>备注（可选）</label><textarea class="notes" rows="2" placeholder="这一段为什么属于这个类型？">${escapeHtml(s.notes||'')}</textarea></div></div></article>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function objectsIn(s){return analysis.preview.objects.filter(o=>o.start_ms>=s.start_ms&&o.start_ms<=s.end_ms)}
function markEdited(s){s.review_state='HUMAN_EDITED'}
function bindSectionEvents(){$$('.section-card').forEach(card=>{const i=Number(card.dataset.i),s=sections[i];card.onclick=e=>{if(!e.target.closest('button,input,select,textarea,label')){activeIndex=i;renderSections()}};card.querySelector('.play-section').onclick=()=>{activeIndex=i;seek(s.start_ms);audio.play().catch(()=>{});renderSections()};card.querySelector('.split').onclick=()=>splitSection(i,(s.start_ms+s.end_ms)/2);card.querySelector('.merge').onclick=()=>mergePrevious(i);card.querySelector('.remove').onclick=()=>{sections.splice(i,1);activeIndex=Math.max(0,Math.min(activeIndex,sections.length-1));renderSections()};card.querySelector('.start').onchange=e=>{const min=i?sections[i-1].end_ms:analysis.preview.start_ms;s.start_ms=Math.max(min,Math.min(s.end_ms-100,Number(e.target.value)));markEdited(s);renderSections(false)};card.querySelector('.end').onchange=e=>{const max=i+1<sections.length?sections[i+1].start_ms:analysis.preview.end_ms;s.end_ms=Math.min(max,Math.max(s.start_ms+100,Number(e.target.value)));markEdited(s);renderSections(false)};card.querySelector('.primary').onchange=e=>{s.primary_type=e.target.value;s.secondary_types=s.secondary_types.filter(v=>v!==s.primary_type);if(s.primary_type!=='GIMMICK'&&!s.secondary_types.includes('GIMMICK'))s.gimmick_subtype=null;markEdited(s);renderSections(false)};card.querySelectorAll('.section-secondary').forEach(x=>x.onchange=()=>{let selected=[...card.querySelectorAll('.section-secondary:checked')].map(y=>y.value);if(selected.length>3){x.checked=false;return msg('每个区段最多三个次类型。','error')}s.secondary_types=selected;if(!selected.includes('GIMMICK')&&s.primary_type!=='GIMMICK')s.gimmick_subtype=null;markEdited(s);renderSections(false)});card.querySelectorAll('.section-tag').forEach(x=>x.onchange=()=>{s.structural_tags=[...card.querySelectorAll('.section-tag:checked')].map(y=>y.value);markEdited(s)});card.querySelectorAll('.contrib button').forEach(x=>x.onclick=()=>{s.contribution=x.dataset.v;markEdited(s);renderSections(false)});card.querySelector('.gimmick-select')?.addEventListener('change',e=>{s.gimmick_subtype=e.target.value||null;markEdited(s)});card.querySelector('.notes').oninput=e=>{s.notes=e.target.value;markEdited(s);card.querySelector('.proposal')?.classList.add('edited')}})}
function splitSection(i,t){const s=sections[i];if(t<=s.start_ms+100||t>=s.end_ms-100)return;markEdited(s);const clone={...s,section_id:`${s.section_id}b`,start_ms:t,secondary_types:[...s.secondary_types],structural_tags:[...s.structural_tags],stats:{...s.stats},machine_proposal:null,review_state:'HUMAN_EDITED'};s.end_ms=t;sections.splice(i+1,0,clone);activeIndex=i+1;renderSections()}
function mergePrevious(i){if(i<=0)return;const a=sections[i-1],b=sections[i];a.end_ms=b.end_ms;a.stats={...a.stats,objects:objectsIn(a).length};a.machine_proposal=null;markEdited(a);sections.splice(i,1);activeIndex=i-1;renderSections()}
function selectedValues(selector){return $$(selector+':checked').map(x=>x.value)}
function updateSummaryGimmick(){const primary=$('#summaryPrimary').value;$$('.summary-secondary').forEach(x=>{x.disabled=x.value===primary;if(x.disabled)x.checked=false});const secondary=selectedValues('.summary-secondary');$('#summaryGimmick').disabled=primary!=='GIMMICK'&&!secondary.includes('GIMMICK');if($('#summaryGimmick').disabled)$('#summaryGimmick').value=''}
$('#summaryPrimary').onchange=updateSummaryGimmick;$('#summarySecondary').onchange=e=>{const selected=selectedValues('.summary-secondary');if(selected.length>3){e.target.checked=false;msg('整图次类型最多三个。','error')}updateSummaryGimmick()};
$('#save').onclick=async()=>{if(!analysis)return;const summary={primary_type:$('#summaryPrimary').value,secondary_types:selectedValues('.summary-secondary'),gimmick_subtype:$('#summaryGimmick').value||null,composition_types:selectedValues('.summary-composition'),notes:$('#summaryNotes').value};const unlabeled=sections.findIndex(s=>s.primary_type==='UNLABELED');if(unlabeled>=0){activeIndex=unlabeled;renderSections();return msg(`区段 #${unlabeled+1} 仍是“未标注”；请选择类型或人工确认无明显类型。`,'error')}if(summary.primary_type==='UNLABELED')return msg('整图主类型仍未标注。','error');const invalid=sections.findIndex(s=>(s.primary_type==='GIMMICK'||s.secondary_types.includes('GIMMICK'))&&!s.gimmick_subtype);if(invalid>=0){activeIndex=invalid;renderSections();return msg(`区段 #${invalid+1} 的 Gimmick 子类型尚未选择。`,'error')}if((summary.primary_type==='GIMMICK'||summary.secondary_types.includes('GIMMICK'))&&!summary.gimmick_subtype)return msg('整图 Gimmick 子类型尚未选择。','error');$('#save').disabled=true;try{const r=await request('/api/annotation',{analysis_id:analysis.analysis_id,sections:sections.map(s=>({section_id:s.section_id,start_ms:s.start_ms,end_ms:s.end_ms,primary_type:s.primary_type,secondary_types:s.secondary_types,gimmick_subtype:s.gimmick_subtype,structural_tags:s.structural_tags,contribution:s.contribution,notes:s.notes})),summary});appState.saved_annotations=r.saved_annotations;$('#saved').textContent=`${r.saved_annotations} 条已保存`;msg(`标注已保存：${r.response_id}`,'ok')}catch(err){msg(err.message,'error')}finally{$('#save').disabled=false}};
init().catch(err=>msg(`初始化失败：${err.message}`,'error'));
</script>
